name: Daily Crime Citation Sync

on:
  schedule:
    # Roz subah 04:30 IST ≈ 23:00 UTC (previous day) — din me ek baar
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (rss-parser + supabase)
        run: npm ci --omit=dev --ignore-scripts || npm install rss-parser @supabase/supabase-js --no-save

      - name: Fetch feeds and sync citations
        run: node scripts/fetch-crime-feeds.mjs